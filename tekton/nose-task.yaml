apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  params:
    - name: args
      type: string
      default: "-v"
    - name: image
      type: string
      default: "python:3.9-slim"
  steps:
    - name: nose
      image: "$(params.image)"
      workingDir: "$(workspaces.source.path)"
      script: |
        #!/bin/bash
        set -e
        pip install -r requirements.txt
        nosetests $(params.args)